<!doctype html><meta charset="utf-8"><title>Auris Merge — scoring sweep</title>
<style>body{font:13px ui-monospace,monospace;background:#111;color:#ddd;padding:20px}
h2{color:#d4af6a}b{color:#e6c684}</style>
<h2>Auris Merge — what each scoring model actually costs</h2>
<pre id="out">running…</pre>
<script src="src/rules.js"></script>
<script>
/* Plays whole games the way a person does — take a merge if one is on the tray,
   otherwise reach into the pouch — for each candidate scoring model.

   Rules.SCORING is the same object the rules close over, so writing to it here
   really does change the scoring under test. */
var SEC_PER_DRAG = 1.35;
var RUNS = 300;

var MODELS = [
  { label: 'finished only, 1pt',  pts: { 2: 0, 3: 1 } },
  { label: 'every merge',         pts: { 2: 1, 3: 1 } },
  { label: 'progressive 1 / 2',   pts: { 2: 1, 3: 2 } },
  { label: 'finished only, 3pt',  pts: { 2: 0, 3: 3 } },
  { label: 'finished only, 5pt',  pts: { 2: 0, 3: 5 } },
  { label: 'finished only, 7pt',  pts: { 2: 0, 3: 7 } }
];

function findMerge(s) {
  for (var i = 0; i < Rules.CELLS; i++) {
    if (!s.cells[i]) continue;
    for (var j = 0; j < Rules.CELLS; j++) {
      if (i !== j && Rules.classify(s, i, j) === 'merge') return [i, j];
    }
  }
  return null;
}

function play(seed) {
  var s = Rules.createState(seed);
  var drags = 0, guard = 0;
  while (!Rules.isComplete(s)) {
    if (++guard > 4000) return null;
    var m = findMerge(s);
    if (m) { Rules.apply(s, m[0], m[1]); drags++; }
    else if (Rules.emptyCells(s).length) { Rules.spawn(s); drags++; }
    else Rules.relieve(s);
  }
  return { drags: drags, score: s.score };
}

var rows = [];
MODELS.forEach(function (m) {
  Rules.SCORING.birthday[2] = m.pts[2];
  Rules.SCORING.birthday[3] = m.pts[3];

  var drags = [], exact = 0, over = 0, worstOver = 0;
  for (var seed = 1; seed <= RUNS; seed++) {
    var r = play(seed);
    if (!r) continue;
    drags.push(r.drags);
    if (r.score === Rules.TARGET) exact++;
    else { over++; worstOver = Math.max(worstOver, r.score); }
  }
  drags.sort(function (a, b) { return a - b; });
  var p50 = drags[Math.floor(drags.length / 2)];
  rows.push({
    label: m.label,
    pts: m.pts[2] + ' / ' + m.pts[3],
    min: drags[0], p50: p50, max: drags[drags.length - 1],
    secs: Math.round(p50 * SEC_PER_DRAG),
    exactPct: Math.round(exact / drags.length * 100),
    worstOver: worstOver
  });
});

var head = 'model                  T2/T3   drags(min/med/max)   ~time   lands on 35   worst score';
var line = '─'.repeat(head.length);
var body = rows.map(function (r) {
  return (r.label + '                      ').slice(0, 22) + ' ' +
         (r.pts + '     ').slice(0, 7) + ' ' +
         (r.min + '/' + r.p50 + '/' + r.max + '            ').slice(0, 20) + ' ' +
         ((r.secs + 's') + '     ').slice(0, 7) + ' ' +
         ((r.exactPct + '%') + '            ').slice(0, 13) + ' ' +
         (r.worstOver ? r.worstOver : '—');
}).join('\n');

document.getElementById('out').textContent =
  head + '\n' + line + '\n' + body +
  '\n\nTarget is ' + Rules.TARGET + '. "lands on 35" is the share of games ending exactly there' +
  '\nrather than overshooting — an overshoot shows the player "36 / 35".' +
  '\nTimes assume ' + SEC_PER_DRAG + 's per drag, ' + RUNS + ' games per model.';
</script>
